# Generate this file from the camera SDK/udev inventory at commissioning time.
schema_version: 1
captured_utc: REPLACE_WITH_ISO8601_UTC
sensor_rig_id: REPLACE_WITH_REAL_SENSOR_RIG_ID
ptp_clock_source: REPLACE_WITH_PTP_CLOCK_SOURCE
camera_order:
  - CAM_FRONT
  - CAM_BACK
  - CAM_FRONT_LEFT
  - CAM_BACK_LEFT
  - CAM_FRONT_RIGHT
  - CAM_BACK_RIGHT
cameras:
  - name: CAM_FRONT
    serial: REPLACE_WITH_CAMERA_SERIAL
    firmware: REPLACE_WITH_CAMERA_FIRMWARE
    sdk_device_id: REPLACE_WITH_SDK_DEVICE_ID
    device_node: REPLACE_WITH_DEVICE_NODE
  - name: CAM_BACK
    serial: REPLACE_WITH_CAMERA_SERIAL
    firmware: REPLACE_WITH_CAMERA_FIRMWARE
    sdk_device_id: REPLACE_WITH_SDK_DEVICE_ID
    device_node: REPLACE_WITH_DEVICE_NODE
  - name: CAM_FRONT_LEFT
    serial: REPLACE_WITH_CAMERA_SERIAL
    firmware: REPLACE_WITH_CAMERA_FIRMWARE
    sdk_device_id: REPLACE_WITH_SDK_DEVICE_ID
    device_node: REPLACE_WITH_DEVICE_NODE
  - name: CAM_BACK_LEFT
    serial: REPLACE_WITH_CAMERA_SERIAL
    firmware: REPLACE_WITH_CAMERA_FIRMWARE
    sdk_device_id: REPLACE_WITH_SDK_DEVICE_ID
    device_node: REPLACE_WITH_DEVICE_NODE
  - name: CAM_FRONT_RIGHT
    serial: REPLACE_WITH_CAMERA_SERIAL
    firmware: REPLACE_WITH_CAMERA_FIRMWARE
    sdk_device_id: REPLACE_WITH_SDK_DEVICE_ID
    device_node: REPLACE_WITH_DEVICE_NODE
  - name: CAM_BACK_RIGHT
    serial: REPLACE_WITH_CAMERA_SERIAL
    firmware: REPLACE_WITH_CAMERA_FIRMWARE
    sdk_device_id: REPLACE_WITH_SDK_DEVICE_ID
    device_node: REPLACE_WITH_DEVICE_NODE
