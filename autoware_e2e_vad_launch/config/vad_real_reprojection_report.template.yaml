# Export this report from the checkerboard calibration evaluation. Do not enter
# values that were not computed from the evidence archive named by commissioning.
schema_version: 1
camera_order:
  - CAM_FRONT
  - CAM_BACK
  - CAM_FRONT_LEFT
  - CAM_BACK_LEFT
  - CAM_FRONT_RIGHT
  - CAM_BACK_RIGHT
sample_count: REPLACE_WITH_TOTAL_CHECKERBOARD_IMAGES
mean_reprojection_error_px: REPLACE_WITH_MEAN_ERROR
maximum_reprojection_error_px: REPLACE_WITH_MAX_ERROR
cameras:
  - name: CAM_FRONT
    image_count: REPLACE_WITH_IMAGE_COUNT
    mean_reprojection_error_px: REPLACE_WITH_MEAN_ERROR
    maximum_reprojection_error_px: REPLACE_WITH_MAX_ERROR
  - name: CAM_BACK
    image_count: REPLACE_WITH_IMAGE_COUNT
    mean_reprojection_error_px: REPLACE_WITH_MEAN_ERROR
    maximum_reprojection_error_px: REPLACE_WITH_MAX_ERROR
  - name: CAM_FRONT_LEFT
    image_count: REPLACE_WITH_IMAGE_COUNT
    mean_reprojection_error_px: REPLACE_WITH_MEAN_ERROR
    maximum_reprojection_error_px: REPLACE_WITH_MAX_ERROR
  - name: CAM_BACK_LEFT
    image_count: REPLACE_WITH_IMAGE_COUNT
    mean_reprojection_error_px: REPLACE_WITH_MEAN_ERROR
    maximum_reprojection_error_px: REPLACE_WITH_MAX_ERROR
  - name: CAM_FRONT_RIGHT
    image_count: REPLACE_WITH_IMAGE_COUNT
    mean_reprojection_error_px: REPLACE_WITH_MEAN_ERROR
    maximum_reprojection_error_px: REPLACE_WITH_MAX_ERROR
  - name: CAM_BACK_RIGHT
    image_count: REPLACE_WITH_IMAGE_COUNT
    mean_reprojection_error_px: REPLACE_WITH_MEAN_ERROR
    maximum_reprojection_error_px: REPLACE_WITH_MAX_ERROR
