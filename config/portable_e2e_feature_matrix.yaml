# HH_260906 - Track every subfeature in a data-training-evaluation sequence without claiming completion.
learning_sequence:
  - id: ITER-01
    features: [SEN-01, SEN-02, SEN-03, SEN-04, RTE-01, RTE-02, RTE-03, RTE-04, SPD-01, SPD-02, SPD-03, SAF-01, SAF-02, SAF-03]
    prerequisites: "Retain physical-v1 and immutable train/val manifests; freeze the experiment settings and retain all candidate results."
    local_next: "Use the completed twelve fixed-pedal measurements for further low-speed cause isolation and collector improvement, requalify natural 30 km/h straight goal stops, then collect independent straight/left/right/stop episodes with lane/drivable labels and untouched test groups. Preserve current shadow timing and prepare selector/fallback fault scenarios."
    training_next: "Preserve the rejected full-model and frozen-head campaigns; qualify, version and transfer new data before the next fixed three-seed comparison. Measure candidate/oracle geometry, ADE/FDE, speed, comfort and subgroup regressions without editing old labels, opening test outcomes or weakening gates."
    exit: "Passing offline candidates may enter isolated shadow; learned CARLA control requires tested selection/fallback and explicit causal ownership. SAF real-release requirements remain pending."
  - id: ITER-02
    features: [TRF-01, TRF-02, TRF-03, TRF-04]
    prerequisites: "Stable route/stop evaluation plus synchronized relevant-signal, line/sign, priority, conflict-zone, and pedestrian labels."
    local_next: "Create phase transitions, required stops, crossings, occlusions, and independent scenario holdouts."
    training_next: "Train behavior and temporal interaction heads with valid masks; evaluate hazardous misses and stop/priority violations before closed-loop."
    exit: "Each traffic subfeature meets its own data, open-loop, runtime, and CARLA closed-loop gates."
  - id: ITER-03
    features: [ACC-01, ACC-02, ACC-03]
    prerequisites: "Lead identity/distance/relative-motion truth, calibrated longitudinal response, and brake/fallback baseline."
    local_next: "Collect following, stopped lead, braking, cut-in, and cut-out scenarios with gap/TTC labels."
    training_next: "Train lead-state and following trajectories; retain fixed-profile gap, response-time, and collision comparisons."
    exit: "ACC feature gates pass across independent actor profiles and three seeds."
  - id: ITER-04
    features: [OBS-01, OBS-02, OBS-03, OBS-04]
    prerequisites: "Static/dynamic occupancy, legal corridor, candidate-wise collision/TTC labels, and an independent AEB implementation."
    local_next: "Build pass-or-stop, no-safe-path, moving-hazard, and AEB envelope scenarios with counterfactual validity."
    training_next: "Train occupancy/motion and risk ranking; evaluate hazardous false negatives and legal clearance. AEB remains independently controlled."
    exit: "Obstacle/risk gates and independent AEB gates pass separately; real AEB validation remains a later closed-course requirement."
  - id: ITER-05
    features: [LCM-01, LCM-02, LCM-03]
    prerequisites: "Legal-boundary, adjacent-lane, front/rear gap, blind-spot, abort, and return-lane labels plus validated collision-risk behavior."
    local_next: "Create left/right lane changes, merges, overtakes, refused gaps, and aborted maneuvers."
    training_next: "Train maneuver-conditioned candidates and gap acceptance; measure illegal selection, rear TTC, and abort recovery."
    exit: "Each lane-change/merge gate passes with independent topology/traffic/weather holdouts."
  - id: ITER-06
    features: [LSP-01, LSP-02]
    prerequisites: "Near-field calibrated coverage, legal stopping/parking targets, reverse-state data, and low-speed control limits."
    local_next: "Collect pull-over, no-safe-area, parking, and reverse episodes with terminal-pose/contact truth."
    training_next: "Train a separately evaluated low-speed/reverse model with terminal-pose and collision objectives."
    exit: "CARLA low-speed gates pass, followed by real replay/shadow and the separately gated closed-course tests."

