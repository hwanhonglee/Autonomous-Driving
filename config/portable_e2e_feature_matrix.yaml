# HH_260906 - Define auditable feature requirements for the portable E2E program.
schema_id: autoware-e2e.portable-feature-matrix.v1
schema_version: 1
as_of: "2026-09-06"
scope: portable_e2e_learned_trajectory_program
gate_revision: engineering_screening_v0_20260906
main_feature_count: 9
subfeature_count: 30
vehicle_control_approved: false

threshold_policy:
  prospective: true
  rule: "Freeze a new revision before opening its test set; never tune this revision to an observed test result."
  interpretation: "These are project engineering gates, not regulatory or public-road approval criteria."

scope_boundary:
  current_checkpoint: "CARLA-only v0, ten epochs, open-loop Town03 validation; source checkpoint SHA-256 370f12dbfa15cc17fa29931bc3c9dd3140dbd7c0a61d976af296fd223b2becf0."
  current_runtime: "Pinned non-executable runtime bundle b9b10e1604ac59eb4375b233d80b8f7ea04d983c0b841d6afddbc39e008c292c passed local CPU strict load, and the ROS graph startup smoke passed; no sensor-fed trajectory, CARLA shadow, 10 Hz pass, or control approval."
  current_runtime_audit: "Runtime geometry gate v6 on Town03 val 337: each candidate c0-c5 and the selected trajectory passed 0/337; selected index 1 was used for 337/337, with stricter reported/geometric speed, acceleration, backward-step, curvature, and lateral-acceleration checks."
  physical_v1: "The acceleration-bounded 30 km/h physical decoder is implemented and unit-tested but remains untrained and unevaluated."
  excluded_claims:
    - "Historical Autoware VAD runtime media do not prove execution of the portable E2E checkpoint."
    - "Expert-agent success does not prove learned-model closed-loop success."
    - "Model-forward latency does not prove sensor-to-actuator latency."
    - "No feature is approved for public-road or real-vehicle actuation."

authoritative_evidence:
  - id: EVIDENCE-20260905
    path: docs/validation-2026-09-05-portable-e2e-common10-30kph.md
    meaning: "Historical one-epoch three-episode data, training, and open-loop baseline."
  - id: EVIDENCE-20260906-DURATION-AB
    path: docs/assets/validation/2026-09-06/portable_e2e_v0_duration_ab_v1/README.md
    meaning: "Current v0 ten-epoch duration A/B, Town03 open-loop metrics, and research-only evidence boundary."
  - id: TRAINING-GUIDE
    path: docs/portable-e2e-training.md
    meaning: "Environment separation and safe operating sequence."
  - id: MODEL-V0
    path: docs/portable-e2e-model-v0.md
    meaning: "Current model ABI, first-run limitations, runtime boundary, and planned M2-M4 heads."
  - id: SHADOW-RUNTIME-GUIDE
    path: docs/portable-e2e-shadow-runtime.md
    meaning: "Fail-closed 10 Hz shadow contract, local launch guide, and current offline audit boundary."
  - id: COMMON10-CONTRACT
    path: portable_e2e/config/common_10hz_v1.contract.json
    meaning: "Canonical camera, time, coordinate, trajectory, and split contract."
  - id: HISTORICAL-AUTOWARE
    path: docs/validation-2026-09-02-runtime-control-campaign.md
    meaning: "Historical VAD/Autoware runtime only, never portable-checkpoint evidence."

environment_responsibility:
  local:
    name: local_carla_autoware_pc
    responsibilities:
      - "Create routes, scenarios, maps, sensor rigs, and calibrated ground truth."
      - "Collect raw episodes, adapt Common10 datasets, validate and publish evidence."
      - "Integrate the selected model with Autoware and run CARLA closed-loop tests."
      - "Run real replay, shadow, and closed-course tests only after their prerequisite gates pass."
  pro6000:
    name: isolated_training_environment
    responsibilities:
      - "Validate an immutable transferred dataset before training."
      - "Run deterministic training, fixed-split open-loop evaluation, and model A/B."
      - "Export checkpoints and parity reports without modifying system or shared environments."
    constraints:
      - "Install packages only in the project-owned personal venv."
      - "Use physical GPU 0 only through a single-device allowlist after an idle check."
      - "Never stop, reset, expose, or alter another GPU or another user's process."
      - "Do not reboot for a project run."

stage_catalog:
  - id: P0_CONTRACT
    exit: "Versioned input/output, label, provenance, metric, and fail-closed validator exist."
  - id: P1_DATA
    exit: "Scenario-qualified train/val/test episodes pass data gates without route/site/day leakage."
  - id: P2_OPEN_LOOP
    exit: "Frozen test, at least three seeds, absolute thresholds, and model A/B gates pass."
  - id: P3_RUNTIME
    exit: "Autoware adapter, export parity, health rejection, and target-PC 10 Hz latency pass."
  - id: P4_CARLA_CLOSED_LOOP
    exit: "Predeclared CARLA scenario matrix passes with learned output causally controlling ego."
  - id: P5_REAL_SHADOW
    exit: "Real replay and shadow pass with actuation disconnected and intervention mining complete."
  - id: P6_CLOSED_COURSE
    exit: "Calibrated real vehicle passes closed-course safety plan; public road remains separately governed."

status_catalog:
  FOUNDATION_PASS_CARLA_ONLY: "Contract/data plumbing passed for the current CARLA corpus; not a driving capability."
  DATA_PARTIAL: "At least one qualified expert episode exists, but required train/val/test diversity is incomplete."
  EXPERT_BEHAVIOR_ONLY: "The expert demonstrated the behavior, but the model lacks required input/label/evaluation evidence."
  OPEN_LOOP_MEASURED_BELOW_TARGET: "Open-loop was measured, but the frozen-test requirement and/or target threshold is unmet."
  MODEL_FORWARD_ONLY: "Only model-forward timing or wiring exists; runtime and closed-loop gates are absent."
  NOT_STARTED: "No qualifying feature-specific data and evaluation evidence exists."
  BLOCKED: "A named prerequisite is missing; work must fail closed."
  CLOSED_LOOP_PASS: "Reserved for a learned-model closed-loop evidence bundle meeting every declared gate."

global_gate_defaults:
  data:
    - "Every selected episode passes common_10hz_v1 planning validation and manual provenance review."
    - "Native six-camera rate is at least 9.5 Hz, p99 gap at most 150 ms, absolute gap at most 250 ms, and bundle coverage at least 99%."
    - "Each feature has independent route/site/day train, val, and untouched test groups; contiguous drives are never split across them."
    - "Missing feature labels use availability flags and valid masks and are never silently zero-filled."
  open_loop:
    - "Thresholds, sample set, seeds, and metric denominators are frozen before the test set is opened."
    - "At least three training seeds are compared with the same data, runtime, hardware class, and sampling budget."
    - "No safety-critical subgroup may regress more than 5% against the accepted baseline."
    - "Test results include map, weather, maneuver, and domain subgroups rather than aggregate-only metrics."
  closed_loop:
    - "The learned trajectory causally owns the tested planning output; expert or recorded-pose replay cannot satisfy the gate."
    - "Each noncritical feature runs at least 20 test episodes and each safety-critical feature at least 30, across at least three seeds and three weather/lighting conditions when applicable."
    - "Collision count is zero, critical traffic-rule violation count is zero, and sensor-to-plan health remains at 10 Hz."
    - "Raw logs, route, configuration, model hash, PNG/GIF, metrics, failures, and denominator counts are preserved."

