    environment: CARLA_ROOT
    candidates:
      - /home/a/carla-autoware-universe/CARLA_0.9.15
    provenance: >-
      Local packaged CARLA 0.9.15 runtime.  OpenDRIVE and cooked-level hashes
      below bind each bundle to the exact runtime inspected on 2026-08-31.

