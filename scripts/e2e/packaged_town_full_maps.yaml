description: >-
  Pinned Lanelet2 and CARLA HD-map point-cloud inputs for the packaged Town
  worlds.  CARLA HDMaps are stored in Unreal/CARLA handedness and must be
  reflected across Y before they are used with ROS map coordinates.

source_contracts:
  lanelet2:
    environment: AUTOWARE_E2E_TOWN_LANELET_ROOT
