    blocker: >-
      No Town10HD/Town10HD_Opt point-cloud map exists anywhere in the inspected
      /home/a filesystem or in the packaged/source CARLA HDMaps directories.  A
      CARLA-rendered driving result is possible, but a truthful full Autoware map
      bundle is blocked until a ROS-coordinate PCD is generated and aligned.  The
      realistic recovery path on this host is a deterministic synchronous
      semantic-LiDAR sweep over the full OpenDRIVE waypoint graph (or an Unreal
      Editor collision-mesh export), world-frame accumulation, static-class
      filtering, voxelization, Y reflection, and Lanelet2/route alignment QA.  A
      PCD synthesized only from Lanelet boundaries is not valid localization-map
      evidence and must not be admitted.  The audited implementation is
      scripts/e2e/generate_carla_semantic_lidar_map.py; this entry remains blocked
      until that collector produces COMPLETE_QA_PASS and its output is hash-pinned
      here.
