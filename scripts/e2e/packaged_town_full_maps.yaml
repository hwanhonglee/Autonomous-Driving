      - /home/a/carla-autoware-universe/op_carla/op_agent/autoware-contents/maps
      - /home/a/carla-autoware-universe/op_carla/op_agent (humble_ok)/autoware-contents/maps
      - /home/a/carla-autoware-universe/op_carla/op_agent (2023.10_ok)/autoware-contents/maps
    provenance: >-
      hwanhonglee/Simulation commit 54a729220a90147d0648c60d76e2cbdd5fec68bf;
      the selected Town files are clean tracked files in the inspected checkout.
